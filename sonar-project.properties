# sonar-project.properties - place in the root of the 8.2CDevSecOps repo
sonar.projectKey=Denny2020_8.2CDevSecOps
sonar.organization=denny2020
sonar.host.url=https://sonarcloud.io
# The token is NOT stored here: the scanner reads the SONAR_TOKEN environment
# variable that Jenkins injects from the SONAR_TOKEN credential.

sonar.sources=.
sonar.exclusions=node_modules/**,test/**,sonar-scanner-*/**,sonar-scanner.zip
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.projectName=NodeJS Goof Vulnerable App
sonar.sourceEncoding=UTF-8
